<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" role="img" aria-labelledby="title desc">
  <title id="title">Pavlov classical conditioning diagram</title>
  <desc id="desc">Before, during, and after learning with food and bell stimuli.</desc>
  <rect width="440" height="360" fill="#faf5ff" rx="12" />
  <text x="220" y="28" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#5b21b6">
    Pavlov - Classical Conditioning
  </text>

  <text x="24" y="58" font-family="system-ui, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#4c1d95">Before learning</text>
  <rect x="24" y="68" width="190" height="44" rx="6" fill="#fff" stroke="#a78bfa" stroke-width="1.5" />
  <text x="34" y="88" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#1e1b4b">Food -> Salivation</text>
  <text x="34" y="102" font-family="system-ui, Segoe UI, sans-serif" font-size="10" fill="#6d28d9">Unconditioned -> Unconditioned</text>
  <rect x="24" y="122" width="190" height="44" rx="6" fill="#fff" stroke="#a78bfa" stroke-width="1.5" />
  <text x="34" y="142" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#1e1b4b">Bell -> No salivation</text>
  <text x="34" y="156" font-family="system-ui, Segoe UI, sans-serif" font-size="10" fill="#6d28d9">Neutral stimulus</text>

  <text x="24" y="198" font-family="system-ui, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#4c1d95">During learning</text>
  <rect x="24" y="208" width="392" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
  <text x="220" y="232" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#4c1d95">
    Bell + Food -> Salivation (association)
  </text>

  <text x="24" y="278" font-family="system-ui, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#4c1d95">After learning</text>
  <rect x="24" y="288" width="392" height="44" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2" />
  <text x="220" y="308" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#1e1b4b">Bell alone -> Salivation</text>
  <text x="220" y="324" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="10" fill="#6d28d9">Conditioned stimulus -> Conditioned response</text>

  <ellipse cx="380" cy="95" rx="36" ry="28" fill="#fcd34d" stroke="#d97706" stroke-width="1.5" />
  <circle cx="368" cy="88" r="4" fill="#1e1b4b" />
  <circle cx="392" cy="88" r="4" fill="#1e1b4b" />
  <path d="M 360 100 Q 380 108 400 100" fill="none" stroke="#1e1b4b" stroke-width="1.5" stroke-linecap="round" />
  <text x="380" y="138" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="9" fill="#78350f">dog (schematic)</text>
</svg>
