name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content
        run: npm run validate:content
      - name: Validate progress export format (sample)
        run: npm run validate:progress -- tests/fixtures/progress-export.sample.json
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # Browser smoke πάνω στο build (vite preview τοπικά· καμία πρόσβαση στο production).
      - name: Install Chromium for smoke
        run: npx playwright install --with-deps chromium
      - name: Browser smoke (built app)
        run: npm run smoke
      # Shadow mode (1E-3): ξεχωριστό build με VITE_PROGRESS_SHADOW_SMOKE=1 και δοκιμαστικό storage·
      # το κανονικό build μένει legacy-only.
      - name: Browser smoke (progress shadow mode)
        run: npm run smoke:shadow
