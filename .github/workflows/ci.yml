name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content
        run: npm run validate:content
      - name: Validate progress export format (sample)
        run: npm run validate:progress -- tests/fixtures/progress-export.sample.json
      - name: Build
        run: npm run build
