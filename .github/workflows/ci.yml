name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content
        run: npm run validate:content
      - name: Validate progress export format (sample)
        run: npm run validate:progress -- tests/fixtures/study-progress.sample.json
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # Browser smoke πάνω στο build (vite preview τοπικά· καμία πρόσβαση στο production).
      - name: Install Chromium for smoke
        run: npx playwright install --with-deps chromium
      - name: Browser smoke (built app)
        run: npm run smoke
      # ProgressService (Φάση 6a, νέο store): πρώτο render χωρίς εγγραφές και με τις τιμές του fixture, mutation builds
      # που ΠΡΕΠΕΙ να αποτύχουν, degraded / αντικατάσταση, δύο tabs, ένα snapshot σε όλους τους consumers.
      - name: Browser smoke (ProgressService)
        run: npm run smoke:progress
